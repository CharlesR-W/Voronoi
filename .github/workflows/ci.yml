name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install test and report dependencies
        run: uv sync --frozen --extra dev --extra report
      - name: Lint
        run: uv run ruff check src tests
      - name: Check formatting
        run: uv run ruff format --check src tests
      - name: Test
        run: uv run pytest

  resnet-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install all test dependencies
        run: uv sync --frozen --extra dev --extra report --extra resnet
      - name: Exercise the optional ResNet path
        run: >-
          uv run pytest
          tests/test_tracking2_adapter.py
          tests/test_exp1_torch_mechanics.py
          tests/test_stage_handlers.py
