[project]
name = "voronoi-residual-lab"
version = "0.1.0"
description = "Gated experiments on candidate cells and fissures in residual computation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
resnet = [
  "pillow>=10,<12",
  "pyarrow>=18",
  "torch>=2.1",
  "torchvision>=0.16",
]
report = [
  "markdown>=3.7,<4",
  "plotly==6.9.0",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
voronoi-lab = "voronoi_lab.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"voronoi_lab.reporting" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
